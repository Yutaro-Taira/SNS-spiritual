    - cron: '0 12 12 4 *'   # 4/12(日) 21:00 JST - おやすみ

  # 手動実行ボタン（GitHub上から投稿できる）
  workflow_dispatch:
    inputs:
      post_id:
        description: '投稿ID（例: 2026-03-16-mon-a）空白なら時刻で自動判定'
        required: false
        default: ''
      dry_run:
        description: 'テスト実行（投稿しない）'
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: poster/requirements.txt

      - name: ライブラリをインストール
        run: pip install -r poster/requirements.txt

      - name: X に投稿
        env:
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.post_id }}" ]; then
            ARGS="--id ${{ github.event.inputs.post_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python poster/post.py $ARGS
